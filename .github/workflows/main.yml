jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17' # Hoặc phiên bản bạn đang dùng
          distribution: 'temurin'
          # Dòng quan trọng nhất đây:
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B package